<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" href="icon.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
        <title>JavaScript Chat</title>
    </head>
    <body>
        <div class="modal" id="editNameModal" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Chat Options</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Change your display name here.</p>
                        <input class="form-control" id="nameInput" placeholder="New Display Name">
                    </div>
                    <div class="modal-footer">
                        <button type="button" data-bs-dismiss="modal" class="btn btn-secondary">Cancel</button>
                        <button id="saveOptionsButton" type="button" class="btn btn-primary">Save</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="msg-group" id="messages-area">                 
        </div>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <button data-bs-toggle="modal" data-bs-target="#editNameModal" class="btn btn-secondary input-btn" type="button">Chat Options</button>
            </div>
            <textarea id="input-box" class="form-control" rows="1"></textarea>
            <div class="input-group-append">
                <button id="send-button" class="btn btn-primary input-btn" type="button">Send Message</button>
            </div>
        </div>
        <span class="badge bg-primary online-users-label">Online Users: <span id="online-users-count">NA</span></span>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.13.1.2.min.js"></script>
        <script>
            (function() {

                function makeid(length) { // Used to create new user IDs.
                    let result = '';
                    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                    for (let i = 0; i < length; i++) {
                        result += characters.charAt(Math.floor(Math.random() * characters.length));
                    }
                    return result;
                }

                const pubnub = new PubNub({ // Set your PubNub keys here.
                    publishKey: 'YOUR_PUBLISH_KEY',
                    subscribeKey: 'YOUR_SUBSCRIBE_KEY',
                    userId: 'Anon-' + makeid(5)
                });

                const messagesArea = document.getElementById('messages-area'),
                    input = document.getElementById('input-box'),
                    sendButton = document.getElementById('send-button'),
                    saveButton = document.getElementById('saveOptionsButton'),
                    nameInput = document.getElementById('nameInput'),
                    onlineCount = document.getElementById('online-users-count'),
                    channelName = 'chat-channel',
                    channel = pubnub.channel(channelName),
                    signalChannelName = 'chat-signals', // Signals get their own channel, apart from chat messages.
                    usernames = {}; // Display names by User ID, read from App Context.

                class chatControl { // Formats messages and scrolls them into view.
                    publishMessage(name, msg, timetoken) {
                        this.show(this.msg(name, msg, 'start', 'primary', null, timetoken));
                    }
                    receiveMessage(userId, msg, timetoken) {
                        if (!(userId in usernames)) { // First message from this user: show the User ID until the name loads.
                            usernames[userId] = userId;
                            loadName(userId);
                        }
                        this.show(this.msg(usernames[userId], msg, 'end', 'secondary', userId, timetoken));
                    }
                    show(card) {
                        messagesArea.appendChild(card);
                        messagesArea.scrollIntoView(false);
                    }
                    msg(name, msg, side, style, userId, timetoken) { // Builds a message card. textContent keeps message text from running as HTML.
                        const card = document.createElement('div');
                        card.className = `card text-white bg-${style}`;
                        const body = document.createElement('div');
                        body.className = 'card-body';
                        const title = document.createElement('h6');
                        title.className = `card-subtitle mb-2 text-${side}`;
                        const nameSpan = document.createElement('span');
                        nameSpan.textContent = name;
                        if (userId) nameSpan.dataset.userId = userId; // Lets loadName() update this card when the name changes.
                        const time = document.createElement('small');
                        time.textContent = ' - ' + new Date(Math.trunc(Number(timetoken) / 10000)).toLocaleString(); // A timetoken counts 100-nanosecond intervals.
                        title.append(nameSpan, time);
                        const text = document.createElement('p');
                        text.className = `card-text float-${side} msg-text`;
                        text.textContent = msg;
                        body.append(title, text);
                        card.append(body);
                        return card;
                    }
                }
                const chat = new chatControl();

                const subscription = channel.subscription({ receivePresenceEvents: true }); // Subscribe to receive messages and presence events.
                subscription.onMessage = (event) => { // Get new messages.
                    if (event.publisher === pubnub.getUserId()) { // Check who sent the message.
                        chat.publishMessage('You', event.message, event.timetoken);
                    } else {
                        chat.receiveMessage(event.publisher, event.message, event.timetoken);
                    }
                };
                subscription.onPresence = (event) => { // Update the number of online users on every join, leave or timeout.
                    onlineCount.textContent = event.occupancy;
                };
                const signalSubscription = pubnub.channel(signalChannelName).subscription(); // Receive name-change signals.
                signalSubscription.onSignal = (event) => { // Another user changed their name: read it again.
                    if (event.message === 'name-changed') {
                        loadName(event.publisher);
                    }
                };
                signalSubscription.subscribe();
                pubnub.addListener({ // Count who is online once the connection to PubNub is up.
                    status: (statusEvent) => {
                        if (statusEvent.category === 'PNConnectedCategory') {
                            updateOccupancy();
                        }
                    }
                });
                subscription.subscribe();

                function publishMessage() { // Send messages with PubNub.
                    const msg = input.value.trim();
                    input.value = '';
                    if (msg !== '') {
                        pubnub.publish({ channel: channelName, message: msg })
                            .catch((error) => console.log(error));
                    }
                }
                sendButton.addEventListener('click', () => {
                    publishMessage();
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { // Enter sends, Shift+Enter adds a new line.
                        e.preventDefault();
                        publishMessage();
                    }
                });

                function updateOccupancy() { // Ask PubNub how many users are on the channel right now.
                    pubnub.hereNow({ channels: [channelName] })
                        .then((response) => {
                            onlineCount.textContent = response.totalOccupancy;
                        })
                        .catch((error) => console.log(error));
                }

                pubnub.fetchMessages({ channels: [channelName], count: 10 }) // Get the last 10 messages sent in the chat.
                    .then((response) => {
                        (response.channels[channelName] || []).forEach((message) => {
                            if (message.uuid === pubnub.getUserId()) { // Check who sent the message.
                                chat.publishMessage('You', message.message, message.timetoken);
                            } else {
                                chat.receiveMessage(message.uuid, message.message, message.timetoken);
                            }
                        });
                    })
                    .catch((error) => console.log(error));

                function loadName(userId) { // Read a user's display name from App Context and update their messages.
                    pubnub.objects.getUUIDMetadata({ uuid: userId })
                        .then((response) => {
                            usernames[userId] = response.data.name || userId;
                            document.querySelectorAll(`[data-user-id="${CSS.escape(userId)}"]`).forEach((nameSpan) => {
                                nameSpan.textContent = usernames[userId];
                            });
                        })
                        .catch(() => {}); // No App Context record yet: keep showing the User ID.
                }

                saveButton.addEventListener('click', () => { // Save the new display name in App Context.
                    const username = nameInput.value.replace(/[^a-zA-Z0-9 ]/g, '').substring(0, 30);
                    pubnub.objects.setUUIDMetadata({ data: { name: username } })
                        .then(() => {
                            alert('Your username has been updated.');
                            return pubnub.signal({ channel: signalChannelName, message: 'name-changed' }); // Tell the other clients to read the new name.
                        })
                        .catch((error) => {
                            alert('Your username was not updated. See the console for details.');
                            console.log(error);
                        });
                });

            })();
        </script>
    </body>
</html>
